syntax = "proto3";

// DRCP (Deletion Reverse Constraint Propagation) schema for proof logging and exchange.
//
// Validation rules (to be enforced by the application, not protobuf):
//   - ConstraintId (sint32) and StepId (uint32) must be non-zero
//   - StepId must be unique within a proof
//   - Variable identifiers must match: [a-zA-Z_][a-zA-Z0-9_]*
//   - Every ConstraintId referenced in the proof must exist in the mapping

package drcp;

message Empty {}

// -----------------------------
// Types
// -----------------------------

// Atomic constraints

enum AtomicOp {
  EQ = 0;  // ==
  NE = 1;  // !=
  LE = 2;  // <=
  GE = 3;  // >=
}

message AtomicConstraint {
  uint32   id    = 1 [(ocaml_type) = int_t];  // ConstraintId
  string   var   = 2;  // identifier, regex-validated in application code
  AtomicOp op    = 3;
  int64    value = 4 [(ocaml_type) = int_t];  // largest possible value but in practice takes less space with binary packing
}

// Inference Hints (Pumpkin-specific)
enum InferenceHint {
  INITIAL_DOMAIN    = 0;
  LINEAR_BOUNDS     = 1;
  NOGOOD            = 2;
  TIME_TABLE        = 3;
  ALL_DIFFERENT     = 4;
  BINARY_EQUALS     = 5;
  BINARY_NOT_EQUALS = 6;
}

// -----------------------------
// Proof steps
// -----------------------------

message InferenceStep {
  // `i <step_id> <premises> [0 <propagated>] [c:<constraint tag>] [l:<filtering algorithm>]`
  uint32 id = 1 [(ocaml_type) = int_t];  // StepId
  repeated sint32 premises     = 2 [(ocaml_type) = int_t];  // List(ConstraintId)
  sint32          propagated   = 3 [(ocaml_type) = int_t];  // ConstraintId; 0 = absent (premises imply conflicting assignment). a.k.a. consequent
  int32           generated_by = 4 [(ocaml_type) = int_t];  // ConstraintId: constraint that introduced this inference

  oneof label {
    InferenceHint label_hint   = 5;  // filtering algorithm / reasoning hint
    string        label_custom = 6;
  }
}

message NogoodStep {
  // `n <step_id> <atomic constraint ids> [0 <propagation hint>]`
  uint32 id = 1 [(ocaml_type) = int_t];  // StepId
  repeated sint32 literals         = 2 [(ocaml_type) = int_t];  // List(ConstraintId)
  repeated uint32 propagation_hint = 3 [(ocaml_type) = int_t];  // List(StepId); optional derivation order hint
}

message ConclusionStep {
  // `c UNSAT`  OR  `c <objective bound>`
  oneof conclusion {
    Empty unsat           = 1;
    sint32                objective_bound = 2 [(ocaml_type) = int_t];  // ConstraintId
  }
}

message ProofStep {
  oneof step {
    InferenceStep    inference  = 1;
    NogoodStep       nogood     = 2;
    ConclusionStep   conclusion = 3;
    AtomicConstraint constraint = 4;
  }
}
